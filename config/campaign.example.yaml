# Campagne-instellingen voor de lead-machine.
# Kopieer naar config/campaign.yaml en pas aan.

region:
  # "auto" laat de machine zelf gemeenten kiezen uit een lijst van 167
  # Nederlandse gemeenten, in willekeurige volgorde en gemengd met de branches
  # hieronder. Je hoeft dan niets te bedenken; hij blijft vanzelf leads vinden.
  #
  # Wil je een vast gebied, zet dan de namen zoals ze in OpenStreetMap heten:
  #   areas:
  #     - "Zwolle"
  #     - "Kampen"
  # Ook te zetten via LM_AREA, met komma's ertussen, of LM_AREA=auto.
  areas:
    - "auto"
  # Voor NL gemeenten is dit 8, voor een wijk of buurt 10.
  # Controleer een naam via https://nominatim.openstreetmap.org
  admin_level: 8

# Elke niche is een groep OSM-tags en levert per gemeente een eigen
# zoekopdracht op. Meer branches betekent meer kans dat een gemeente iets
# oplevert: een hovenier staat in een dorp van 8.000 inwoners vaak niet in
# OpenStreetMap, een bakker, kapper of cafe bijna altijd wel.
#
# De keuze is niet willekeurig. Het zijn branches waar (a) mensen online naar
# zoeken voordat ze bellen, (b) de ondernemer zelf geen tijd heeft om een site
# te bouwen, en (c) OpenStreetMap in Nederland goed gevuld is.
niches:
  # --- Persoonlijke verzorging ---
  - name: kapper
    label: kapsalon
    filters: ["shop=hairdresser"]
  - name: schoonheidssalon
    label: schoonheidssalon
    filters: ["shop=beauty", "shop=massage"]
  - name: tattoo
    label: tattooshop
    filters: ["shop=tattoo"]

  # --- Bouw en techniek ---
  - name: aannemer
    label: aannemersbedrijf
    filters: ["craft=builder", "office=construction_company", "craft=carpenter"]
  - name: installateur
    label: installatiebedrijf
    filters: ["craft=plumber", "craft=electrician", "craft=hvac"]
  - name: schilder
    label: schildersbedrijf
    filters: ["craft=painter", "craft=plasterer"]
  - name: dakdekker
    label: dakdekkersbedrijf
    filters: ["craft=roofer", "craft=insulation", "craft=scaffolder"]
  - name: kozijnen
    label: kozijnen- en zonweringbedrijf
    filters: ["craft=window_construction", "craft=glaziery", "shop=window_blind"]
  - name: meubelmaker
    label: meubelmakerij
    filters: ["craft=cabinet_maker", "shop=furniture", "shop=flooring"]

  # --- Auto en fiets ---
  - name: garage
    label: autobedrijf
    filters: ["shop=car_repair", "shop=tyres"]
  - name: autohandel
    label: autobedrijf
    filters: ["shop=car", "shop=car_parts"]
  - name: fietsenmaker
    label: fietsenzaak
    filters: ["shop=bicycle", "shop=motorcycle_repair"]
  - name: rijschool
    label: rijschool
    filters: ["amenity=driving_school"]

  # --- Groen ---
  - name: hovenier
    label: hoveniersbedrijf
    filters: ["craft=gardener", "shop=garden_centre"]

  # --- Horeca ---
  - name: restaurant
    label: restaurant
    filters: ["amenity=restaurant"]
  - name: cafe
    label: cafe
    filters: ["amenity=cafe", "amenity=bar", "amenity=pub"]
  - name: snackbar
    label: cafetaria
    filters: ["amenity=fast_food", "amenity=ice_cream"]
  - name: catering
    label: cateringbedrijf
    filters: ["craft=caterer"]
  - name: hotel
    label: hotel
    filters: ["tourism=hotel", "tourism=guest_house", "tourism=chalet"]

  # --- Winkels met vakmanschap ---
  - name: bakker
    label: bakkerij
    filters: ["shop=bakery", "shop=pastry", "shop=chocolate"]
  - name: slager
    label: slagerij
    filters: ["shop=butcher"]
  - name: delicatessen
    label: speciaalzaak
    filters: ["shop=deli", "shop=cheese", "shop=greengrocer", "shop=seafood"]
  - name: bloemist
    label: bloemenzaak
    filters: ["shop=florist"]
  - name: slijterij
    label: slijterij
    filters: ["shop=alcohol", "shop=beverages"]
  - name: kleding
    label: kledingzaak
    filters: ["shop=clothes", "shop=boutique", "shop=shoes"]
  - name: juwelier
    label: juwelier
    filters: ["shop=jewelry", "shop=watches"]
  - name: opticien
    label: opticien
    filters: ["shop=optician", "shop=hearing_aids"]
  - name: computerzaak
    label: computer- en telefoonzaak
    filters: ["shop=computer", "shop=mobile_phone", "shop=electronics"]
  - name: keuken
    label: keuken- en interieurzaak
    filters: ["shop=kitchen", "shop=bathroom_furnishing", "shop=interior_decoration"]
  - name: dierenwinkel
    label: dierenspeciaalzaak
    filters: ["shop=pet", "shop=pet_grooming"]

  # --- Zorg ---
  - name: tandarts
    label: tandartspraktijk
    filters: ["amenity=dentist"]
  - name: fysiotherapeut
    label: fysiotherapiepraktijk
    filters: ["healthcare=physiotherapist", "healthcare=podiatrist"]
  - name: dierenarts
    label: dierenartsenpraktijk
    filters: ["amenity=veterinary"]

  # --- Diensten aan huis en kantoor ---
  - name: makelaar
    label: makelaarskantoor
    filters: ["office=estate_agent"]
  - name: boekhouder
    label: administratiekantoor
    filters: ["office=accountant", "office=tax_advisor", "office=financial_advisor"]
  - name: fotograaf
    label: fotograaf
    filters: ["craft=photographer", "shop=photo"]
  - name: stomerij
    label: stomerij
    filters: ["shop=dry_cleaning", "shop=laundry"]
  - name: uitvaart
    label: uitvaartonderneming
    filters: ["shop=funeral_directors"]
  - name: sportschool
    label: sportschool
    filters: ["leisure=fitness_centre"]
  - name: reisbureau
    label: reisbureau
    filters: ["shop=travel_agency"]

audit:
  timeout_seconds: 12
  # Seconden tussen twee requests naar dezelfde host. Wees netjes.
  delay_seconds: 1.5
  respect_robots: true
  user_agent: "LeadMachine/1.0 (+https://jouwbedrijf.nl/bot; hallo@jouwbedrijf.nl)"

scoring:
  # Vanaf welke score een lead in welk bakje valt.
  hot_threshold: 50
  warm_threshold: 30

outreach:
  # Verplichte afzendergegevens. Zonder dit versturen we niets:
  # onder de EU-regels moet elke commerciele mail herleidbaar zijn.
  sender_name: "Jouw Naam"
  sender_email: "hallo@jouwbedrijf.nl"
  company_name: "Jouw Bedrijf"
  company_address: "Straatnaam 1, 8011 AA Zwolle"
  kvk: "12345678"
  phone: "06 12345678"
  reply_to: "hallo@jouwbedrijf.nl"

  # Harde limieten. Meer dan dit per dag is geen outreach maar spam,
  # en het verbrandt je domeinreputatie binnen een week.
  daily_limit: 25
  seconds_between_sends: 45
  # Niet dezelfde onderneming binnen zoveel dagen opnieuw mailen.
  cooldown_days: 90
  suppression_file: "suppression.txt"

autopilot:
  # Zet op true en de machine mag zelf zoeken, bouwen, opstellen en versturen.
  # Staat hij uit, dan doet 'run' alles behalve versturen.
  enabled: false
  # Tijdstip waarop de dagelijkse cyclus start (lokale tijd).
  run_at: "09:15"
  # Nieuwe bedrijven ophalen kost tijd en levert dagelijks niets nieuws op.
  discover_every_days: 7
  audits_per_run: 200
  demos_per_run: 25
  mails_per_run: 20
  # auto   = direct versturen
  # review = eerst in de wachtrij, zodat je in het dashboard nog kunt ingrijpen
  send_mode: review
  review_hours: 12
  # Onder deze score niet mailen; die bedrijven hebben je niet nodig.
  min_score: 45
  # 'overpass' voor echte data, 'fixture' om offline te oefenen.
  source: overpass
  # Alleen bedrijven zonder eigen website ophalen. Dat scheelt een lijst vol
  # bedrijven die je toch niet benadert, en zulke leads hoeven ook niet
  # gecontroleerd te worden - verreweg de traagste stap.
  # Zet op false als je ook verouderde of kapotte sites wilt meenemen.
  alleen_zonder_website: true

offer:
  # Wat je verkoopt. Komt terug in de mail en op de demo-pagina.
  product: "een complete website inclusief teksten, foto's en Google-vindbaarheid"
  price_from: 750
  turnaround_days: 7
